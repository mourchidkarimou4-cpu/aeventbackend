# Arishebola Multi-service — Nginx (reverse proxy) — exemple pour hébergement VPS
# Alternative à Render. À adapter : domaines, chemins, certificat SSL.

# HTTPS (via Certbot) :
#   sudo certbot --nginx -d votre-domaine.com

upstream django {
    server 127.0.0.1:8000;  # gunicorn
}

server {
    listen 80;
    server_name votre-domaine.com www.votre-domaine.com;

    # Redirection vers HTTPS (active quand le certificat existe)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name votre-domaine.com www.votre-domaine.com;

    # ssl_certificate /etc/letsencrypt/live/votre-domaine.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/votre-domaine.com/privkey.pem;

    client_max_body_size 60M;  # uploads devis/dossier (50 Mo max)

    # API Django
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Requis par SECURE_PROXY_SSL_HEADER / SECURE_SSL_REDIRECT
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers uploadés (stockage local MEDIA_ROOT)
    location /media/ {
        alias /opt/aevents/aeventbackend-main/media/;
        access_log off;
        expires 30d;
    }

    # Statiques Django servies par WhiteNoise directement via gunicorn —
    # pas besoin de location /static/ avec nginx.
}
